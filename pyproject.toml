# Solo configuracion de herramientas; el proyecto no es un paquete instalable.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["scraper"]
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
