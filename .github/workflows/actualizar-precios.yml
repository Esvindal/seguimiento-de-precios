name: actualizar-precios

on:
  schedule:
    # Cada 6 horas (a los 17 minutos para esquivar el pico de la hora en punto).
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Correr el scraper
        run: python -m scraper.main --paginas 3 --salida data/precios.json --demora 2

      - name: Commit solo si cambiaron los datos
        run: |
          if git diff --quiet data/precios.json docs/data/; then
            echo "Sin cambios: nada que commitear"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/precios.json docs/data/
            git commit -m "data: actualizacion de precios $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
